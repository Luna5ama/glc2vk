syntax = "proto3";

package vibris.control.v1;

option java_multiple_files = true;
option java_package = "dev.vibris.protocol.v1";
option java_outer_classname = "VibrisControlProto";

service VibrisControl {
    rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
    rpc ListPresets(ListPresetsRequest) returns (ListPresetsResponse);
    rpc ValidateContext(ValidateContextRequest) returns (ValidateContextResponse);
    rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
    rpc Control(stream ClientMessage) returns (stream ServerMessage);
}

message ProtocolVersion {
    uint32 major = 1;
    uint32 minor = 2;
}

enum Capability {
    CAPABILITY_UNSPECIFIED = 0;
    CAPABILITY_CONTROL_STREAM = 1;
    CAPABILITY_RESUME = 2;
    CAPABILITY_PREPARED_SOURCES = 3;
    CAPABILITY_ACTION_SEQUENCE = 7;
    CAPABILITY_ARTIFACT_METADATA = 8;
}

message ClientMessage {
    ProtocolVersion protocol_version = 1;
    string message_id = 2;
    string request_id = 3;
    string workspace_id = 4;
    oneof payload {
        ClientHello client_hello = 10;
        SubmitJob submit_job = 11;
        CancelJob cancel_job = 12;
        ResumeRequest resume_request = 13;
        Ping ping = 14;
    }
}

message ServerMessage {
    ProtocolVersion protocol_version = 1;
    string message_id = 2;
    string request_id = 3;
    string workspace_id = 4;
    oneof payload {
        ServerHello server_hello = 10;
        JobAccepted job_accepted = 11;
        JobProgress job_progress = 12;
        JobCompleted job_completed = 13;
        JobFailed job_failed = 14;
        ResumeState resume_state = 15;
        Pong pong = 16;
        ServerShuttingDown server_shutting_down = 17;
    }
}

message ClientHello {
    ProtocolVersion protocol_version = 1;
    string mcp_version = 2;
    string workspace_id = 3;
    string process_instance_uuid = 4;
    optional string worktree_display_name = 5;
    repeated Capability capabilities = 6;
}

message ServerHello {
    ProtocolVersion protocol_version = 1;
    string server_version = 2;
    repeated Capability capabilities = 3;
    bool ready = 4;
    ServerStatus status = 5;
    ServerLimits limits = 6;
    repeated JobActionKind supported_job_actions = 8;
    repeated ArtifactFormat supported_formats = 9;
    string pending_shaders_root = 10;
    string artifact_root = 11;
}

message ServerLimits {
    uint64 max_source_bytes = 1;
    uint32 max_source_files = 2;
}

message GetServerInfoRequest {}

message GetServerInfoResponse {
    ServerHello server = 1;
}

message ListPresetsRequest {}

message ListPresetsResponse {
    repeated ScenePreset presets = 1;
}

message ScenePreset {
    string preset_id = 1;
    string display_name = 2;
    SceneContext context = 3;
    string version = 4;
    repeated string tags = 5;
    string preset_sha256 = 6;
}

message ValidateContextRequest {
    SceneContext context = 1;
}

message ValidateContextResponse {
    bool valid = 1;
    repeated ProtocolError errors = 2;
}

message GetStatusRequest {}

message GetStatusResponse {
    bool ready = 1;
    ServerStatus status = 2;
    repeated ProtocolError errors = 3;
}

message ServerStatus {
    ServerState state = 1;
    string active_request_id = 2;
    repeated JobSummary jobs = 3;
    bool runtime_ready = 4;
    RuntimeState runtime_state = 5;
    string current_save_id = 6;
    string current_dimension_id = 7;
    string active_source_uuid = 8;
    uint32 queue_length = 9;
    ResourceCatalog resource_catalog = 10;
    string pending_shaders_root = 11;
    string artifact_root = 12;
    uint64 artifact_quota_used_bytes = 13;
    uint64 artifact_quota_cap_bytes = 14;
    repeated JobActionKind supported_job_actions = 16;
    repeated ArtifactFormat supported_formats = 17;
}

enum ServerState {
    SERVER_STATE_UNSPECIFIED = 0;
    SERVER_STATE_STARTING = 1;
    SERVER_STATE_READY = 2;
    SERVER_STATE_BUSY = 3;
    SERVER_STATE_STOPPING = 4;
    SERVER_STATE_FAILED = 5;
}

enum RuntimeState {
    RUNTIME_STATE_UNSPECIFIED = 0;
    RUNTIME_STATE_NOT_READY = 1;
    RUNTIME_STATE_LOADING_WORLD = 2;
    RUNTIME_STATE_READY = 3;
    RUNTIME_STATE_RELOADING_SHADERS = 4;
    RUNTIME_STATE_FAILED = 5;
}

message ResourceCatalog {
    repeated ResourceCatalogEntry textures = 1;
    repeated ResourceCatalogEntry buffers = 2;
}

message ResourceCatalogEntry {
    string logical_name = 1;
    ResourceKind kind = 2;
    string internal_format = 3;
}

message ProtocolError {
    ErrorCode code = 1;
    string message = 2;
    string field = 3;
    bool retryable = 4;
    map<string, string> details = 5;
    string log_path = 6;
}

enum ErrorCode {
    ERROR_CODE_UNSPECIFIED = 0;
    NOT_CONFIGURED = 1;
    SERVER_OFFLINE = 2;
    SERVER_NOT_READY = 3;
    PROTOCOL_MISMATCH = 4;
    reserved 5;
    INVALID_WORKTREE = 6;
    SHADERS_DIRECTORY_MISSING = 7;
    SOURCE_CHANGED_DURING_SNAPSHOT = 8;
    SOURCE_TOO_LARGE = 9;
    SOURCE_TOO_MANY_FILES = 10;
    SOURCE_CONTAINS_REPARSE_POINT = 11;
    COMMIT_NOT_FOUND = 12;
    COMMIT_HAS_NO_SHADERS = 13;
    INVALID_SOURCE_UUID = 14;
    SOURCE_DIRECTORY_MISSING = 15;
    INVALID_PRESET = 16;
    WORLD_LOAD_FAILED = 17;
    SOURCE_ACTIVATION_FAILED = 18;
    SYMLINK_SWITCH_FAILED = 19;
    SHADER_COMPILE_FAILED = 20;
    QUEUE_FULL = 21;
    QUEUE_TIMEOUT = 22;
    EXECUTION_TIMEOUT = 23;
    CAPTURE_RESOURCE_NOT_FOUND = 24;
    CAPTURE_FAILED = 25;
    ARTIFACT_JOB_TOO_LARGE = 26;
    ARTIFACT_QUOTA_EXCEEDED = 27;
    CANCELLED = 28;
    SERVER_RESTARTED = 29;
    INTERNAL_ERROR = 30;
    BENCHMARK_STATE_UNAVAILABLE = 31;
    BENCHMARK_RESTORE_FAILED = 32;
    BENCHMARK_BARRIER_FAILED = 33;
}

message PreparedSourceRef {
    string uuid = 1;
    SourceOrigin origin = 2;
    uint64 file_count = 3;
    uint64 total_bytes = 4;
    string requested_revision = 5;
    string resolved_revision = 6;
}

message SourceOrigin {
    oneof kind {
        WorkspaceOrigin workspace = 1;
        CommitOrigin commit = 2;
    }
}

message WorkspaceOrigin {
    string display_name = 1;
}

message CommitOrigin {
    string repository_id = 1;
    string revision = 2;
}

message SceneContext {
    string save_id = 1;
    string dimension_id = 2;
    string time_preset_id = 3;
    string weather_preset_id = 4;
    string camera_preset_id = 5;
    double fov = 6;
    Resolution resolution = 7;
    string settings_preset_id = 8;
}

message Resolution {
    uint32 width = 1;
    uint32 height = 2;
}

message JobTimeouts {
    uint64 queue_timeout_ms = 1;
    uint64 execution_timeout_ms = 2;
    uint64 total_timeout_ms = 3;
}

message SubmitJob {
    string request_id = 1;
    string workspace_id = 2;
    SceneContext context = 3;
    repeated PreparedSourceRef sources = 4;
    ActionSequence actions = 6;
    JobTimeouts timeouts = 7;
    ShaderConfig shader_config = 8;
    repeated NamedShaderConfig shader_configs = 9;
    ResultArtifactOptions result_artifacts = 10;
    BenchmarkProvenance benchmark_provenance = 11;
    BenchmarkCase benchmark_case = 12;
}

message BenchmarkProvenance {
    string preset_id = 1;
    string preset_version = 2;
    string preset_display_name = 3;
}

message BenchmarkCase {
    string workflow_id = 1;
    string case_id = 2;
}

message ResultArtifactOptions {
    bool json = 1;
    bool csv = 2;
    string kind = 3;
    repeated string converted_units = 4;
    uint32 attempt = 5;
    repeated ResultAttemptDiagnostic previous_attempts = 6;
}

message ResultAttemptDiagnostic {
    uint32 attempt = 1;
    string status = 2;
    string error_code = 3;
    string message = 4;
    bool retryable = 5;
}

message ShaderConfig {
    map<string, string> values = 1;
}

message NamedShaderConfig {
    string id = 1;
    ShaderConfig config = 2;
    bool preserve = 3;
}

message ActionSequence {
    repeated Action actions = 1;
}

message Action {
    reserved 4, 5, 21, 25, 26, 27, 29, 30, 31, 32, 33;
    reserved "capture_screenshot", "get_shader_status", "get_shader_errors", "schedule_screenshot",
        "get_screenshot_result", "capture_texture", "capture_buffer", "list_ssbos", "dump_ssbo",
        "list_textures", "dump_texture", "list_patched_shaders";
    oneof action {
        ResetTemporalState reset_temporal_state = 1;
        WaitFrames wait_frames = 2;
        TakeScreenshot take_screenshot = 3;
        ActivateSource activate_source = 6;
        CompareCaptures compare_captures = 7;
        EmptyAction get_capture_status = 20;
        CapturePass capture_pass = 22;
        CaptureMulti capture_multi = 23;
        EmptyAction inspect_shader = 24;
        GetGpuMetrics get_gpu_metrics = 28;
        LoadShader load_shader = 34;
        EmptyAction list_textures_v2 = 35;
        DumpTextureV2 dump_texture_v2 = 36;
        EmptyAction list_buffers = 37;
        DumpBuffer dump_buffer = 38;
        GetPatchedShaders get_patched_shaders = 39;
    }
}

enum JobActionKind {
    reserved 4, 5, 21, 25, 26, 27, 29, 30, 31, 32, 33;
    reserved "JOB_ACTION_KIND_CAPTURE_SCREENSHOT", "JOB_ACTION_KIND_GET_SHADER_STATUS",
        "JOB_ACTION_KIND_GET_SHADER_ERRORS", "JOB_ACTION_KIND_SCHEDULE_SCREENSHOT",
        "JOB_ACTION_KIND_GET_SCREENSHOT_RESULT", "JOB_ACTION_KIND_CAPTURE_TEXTURE",
        "JOB_ACTION_KIND_CAPTURE_BUFFER", "JOB_ACTION_KIND_LIST_SSBOS", "JOB_ACTION_KIND_DUMP_SSBO",
        "JOB_ACTION_KIND_LIST_TEXTURES", "JOB_ACTION_KIND_DUMP_TEXTURE",
        "JOB_ACTION_KIND_LIST_PATCHED_SHADERS";
    JOB_ACTION_KIND_UNSPECIFIED = 0;
    JOB_ACTION_KIND_RESET_TEMPORAL_STATE = 1;
    JOB_ACTION_KIND_WAIT_FRAMES = 2;
    JOB_ACTION_KIND_TAKE_SCREENSHOT = 3;
    JOB_ACTION_KIND_ACTIVATE_SOURCE = 6;
    JOB_ACTION_KIND_COMPARE_CAPTURES = 7;
    JOB_ACTION_KIND_GET_CAPTURE_STATUS = 20;
    JOB_ACTION_KIND_CAPTURE_PASS = 22;
    JOB_ACTION_KIND_CAPTURE_MULTI = 23;
    JOB_ACTION_KIND_INSPECT_SHADER = 24;
    JOB_ACTION_KIND_GET_GPU_METRICS = 28;
    JOB_ACTION_KIND_LOAD_SHADER = 34;
    JOB_ACTION_KIND_LIST_TEXTURES_V2 = 35;
    JOB_ACTION_KIND_DUMP_TEXTURE_V2 = 36;
    JOB_ACTION_KIND_LIST_BUFFERS = 37;
    JOB_ACTION_KIND_DUMP_BUFFER = 38;
    JOB_ACTION_KIND_GET_PATCHED_SHADERS = 39;
}

message ActivateSource {
    string source_uuid = 1;
}

message CompareCaptures {
    uint32 baseline_capture_index = 1;
    uint32 candidate_capture_index = 2;
    string baseline_label = 3;
    string candidate_label = 4;
}

message ResetTemporalState {}

message WaitFrames {
    uint32 frame_count = 1;
}

message TakeScreenshot {
    string artifact_name = 1;
    ArtifactFormat format = 2;
    uint32 after_frames = 3;
}

message DumpTextureV2 {
    string logical_name = 1;
    ArtifactFormat format = 2;
    string artifact_name = 3;
}

message DumpBuffer {
    string logical_name = 1;
    string artifact_name = 2;
}

message CancelJob {
    string request_id = 1;
    string reason = 2;
}

message ResumeRequest {
    repeated string request_ids = 1;
}

message Ping {
    uint64 sequence = 1;
    uint64 client_time_unix_ms = 2;
}

message Pong {
    uint64 sequence = 1;
    uint64 client_time_unix_ms = 2;
    uint64 server_time_unix_ms = 3;
}

message JobAccepted {
    string request_id = 1;
    uint32 queue_position = 2;
}

message JobProgress {
    string request_id = 1;
    JobStage stage = 2;
    uint32 percent = 3;
    string detail = 4;
}

enum JobStage {
    JOB_STAGE_UNSPECIFIED = 0;
    JOB_STAGE_VALIDATING = 1;
    JOB_STAGE_QUEUED = 2;
    JOB_STAGE_ACTIVATING_SOURCE = 3;
    JOB_STAGE_LOADING_WORLD = 4;
    JOB_STAGE_APPLYING_CONTEXT = 5;
    JOB_STAGE_RELOADING_SHADERS = 6;
    JOB_STAGE_RESETTING_TEMPORAL_STATE = 7;
    JOB_STAGE_WARMING_UP = 8;
    JOB_STAGE_CAPTURING = 9;
    JOB_STAGE_WRITING_ARTIFACTS = 10;
    JOB_STAGE_COMPARING = 11;
    JOB_STAGE_FINALIZING = 12;
    JOB_STAGE_SAMPLING = 13;
}

message JobCompleted {
    string request_id = 1;
    JobResult result = 2;
}

message JobFailed {
    string request_id = 1;
    ProtocolError error = 2;
    repeated ArtifactMetadata artifacts = 3;
}

message ResumeState {
    repeated JobSummary jobs = 1;
}

message ServerShuttingDown {
    string reason = 1;
    uint64 retry_after_ms = 2;
}

message JobSummary {
    string request_id = 1;
    JobState state = 2;
    JobStage stage = 3;
}

enum JobState {
    JOB_STATE_UNSPECIFIED = 0;
    JOB_STATE_QUEUED = 1;
    JOB_STATE_RUNNING = 2;
    JOB_STATE_COMPLETED = 3;
    JOB_STATE_FAILED = 4;
    JOB_STATE_CANCELLED = 5;
}

message JobResult {
    JobResultKind kind = 1;
    repeated ArtifactMetadata artifacts = 2;
    AbComparisonResult comparison = 3;
    JobTimings timings = 4;
    repeated ShaderDiagnostic shader_diagnostics = 5;
    repeated uint64 frame_ids = 6;
    string manifest_path = 7;
    repeated ActionResult action_results = 8;
    repeated ArtifactGroup artifact_groups = 9;
    repeated BenchmarkBarrierReceipt benchmark_barriers = 10;
}

message ArtifactGroup {
    string name = 1;
    ResourceDescriptor resource = 2;
    repeated ArtifactMetadata artifacts = 3;
}

message ActionResult {
    uint32 action_index = 1;
    JobActionKind kind = 2;
    string json = 3;
    string case_id = 4;
}

enum BenchmarkBarrierStage {
    BENCHMARK_BARRIER_STAGE_UNSPECIFIED = 0;
    BENCHMARK_BARRIER_STAGE_SOURCE_PUBLISHED = 1;
    BENCHMARK_BARRIER_STAGE_CONFIG_APPLIED = 2;
    BENCHMARK_BARRIER_STAGE_SHADER_RELOADED = 3;
    BENCHMARK_BARRIER_STAGE_SHADER_GENERATION_CONFIRMED = 4;
    BENCHMARK_BARRIER_STAGE_WARMUP_STARTED = 5;
    BENCHMARK_BARRIER_STAGE_WARMUP_COMPLETED = 6;
    BENCHMARK_BARRIER_STAGE_SAMPLE_STARTED = 7;
    BENCHMARK_BARRIER_STAGE_SAMPLE_COMPLETED = 8;
    BENCHMARK_BARRIER_STAGE_STATE_RESTORED = 9;
}

message BenchmarkBarrierReceipt {
    string case_id = 1;
    BenchmarkBarrierStage stage = 2;
    uint32 ordinal = 3;
    string source_uuid = 4;
    string config_sha256 = 5;
    uint64 shader_generation = 6;
    string detail = 7;
}

message JobTimings {
    uint64 started_at_unix_ms = 1;
    uint64 completed_at_unix_ms = 2;
    uint64 queue_ms = 3;
    uint64 execution_ms = 4;
    uint64 total_ms = 5;
}

message ShaderDiagnostic {
    DiagnosticSeverity severity = 1;
    string file_name = 2;
    uint32 line = 3;
    uint32 column = 4;
    string message = 5;
    string log_path = 6;
}

enum DiagnosticSeverity {
    DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
    DIAGNOSTIC_SEVERITY_INFO = 1;
    DIAGNOSTIC_SEVERITY_WARNING = 2;
    DIAGNOSTIC_SEVERITY_ERROR = 3;
}

enum JobResultKind {
    JOB_RESULT_KIND_UNSPECIFIED = 0;
    JOB_RESULT_KIND_ACTION_SEQUENCE = 4;
}

message AbComparisonResult {
    string baseline_label = 1;
    string candidate_label = 2;
    double mean_absolute_error = 3;
    double root_mean_square_error = 4;
    double max_absolute_error = 5;
}

message ArtifactMetadata {
    string artifact_id = 1;
    string file_name = 2;
    ArtifactKind kind = 3;
    ArtifactFormat format = 4;
    string media_type = 5;
    uint64 byte_size = 6;
    ResourceDescriptor resource = 7;
    string path = 8;
    ArtifactRole role = 9;
    optional uint32 subresource_index = 10;
}

enum ArtifactRole {
    ARTIFACT_ROLE_UNSPECIFIED = 0;
    ARTIFACT_ROLE_PRIMARY = 1;
    ARTIFACT_ROLE_SUBRESOURCE = 2;
    ARTIFACT_ROLE_METADATA = 3;
}

enum ArtifactKind {
    ARTIFACT_KIND_UNSPECIFIED = 0;
    ARTIFACT_KIND_SCREENSHOT = 1;
    ARTIFACT_KIND_TEXTURE = 2;
    ARTIFACT_KIND_BUFFER = 3;
    ARTIFACT_KIND_SHADER_COMPILE_LOG = 4;
    ARTIFACT_KIND_AB_METRICS = 5;
    ARTIFACT_KIND_HEATMAP = 6;
    ARTIFACT_KIND_MANIFEST = 7;
    ARTIFACT_KIND_PATCHED_SHADER = 8;
    ARTIFACT_KIND_PROFILE_RESULT = 9;
}

enum ArtifactFormat {
    reserved 3;
    reserved "ARTIFACT_FORMAT_RAW";
    ARTIFACT_FORMAT_UNSPECIFIED = 0;
    ARTIFACT_FORMAT_PNG = 1;
    ARTIFACT_FORMAT_EXR = 2;
    ARTIFACT_FORMAT_BIN = 4;
    ARTIFACT_FORMAT_TEXT = 5;
    ARTIFACT_FORMAT_JSON = 6;
    ARTIFACT_FORMAT_CSV = 7;
}

message ResourceDescriptor {
    string logical_name = 1;
    ResourceKind kind = 2;
    uint32 width = 3;
    uint32 height = 4;
    uint32 depth = 5;
    uint32 mip_level = 6;
    uint32 layer = 7;
    string internal_format = 8;
    uint32 channel_count = 9;
    ScalarType scalar_type = 10;
    uint64 byte_size = 11;
    uint64 frame_id = 12;
    string semantic_label = 13;
    string category = 14;
    string texture_target = 15;
    string channel_layout = 16;
    string numeric_class = 17;
    uint32 component_bits = 18;
    string readback_format = 19;
    string readback_type = 20;
    uint32 mip_levels = 21;
}

enum ResourceKind {
    RESOURCE_KIND_UNSPECIFIED = 0;
    RESOURCE_KIND_FINAL_FRAMEBUFFER = 1;
    RESOURCE_KIND_TEXTURE = 2;
    RESOURCE_KIND_BUFFER = 3;
    RESOURCE_KIND_PATCHED_SHADERS = 4;
}

enum ScalarType {
    SCALAR_TYPE_UNSPECIFIED = 0;
    SCALAR_TYPE_UINT8 = 1;
    SCALAR_TYPE_SINT8 = 2;
    SCALAR_TYPE_UINT16 = 3;
    SCALAR_TYPE_SINT16 = 4;
    SCALAR_TYPE_UINT32 = 5;
    SCALAR_TYPE_SINT32 = 6;
    SCALAR_TYPE_FLOAT16 = 7;
    SCALAR_TYPE_FLOAT32 = 8;
}

message EmptyAction {}

message GetPatchedShaders {
    string artifact_name = 1;
}

message LoadShader {
    string source_uuid = 1;
    string source_id = 2;
    string config_id = 3;
    string case_id = 4;
    bool continue_on_failure = 5;
}

message CapturePass {
    string pass = 1;
    optional string path = 2;
}

message CaptureMulti {
    string type = 1;
    optional string path = 2;
}

message GetGpuMetrics {
    uint32 frames = 1;
}
